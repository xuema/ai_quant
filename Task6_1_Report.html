document.getElementById("s1").innerHTML="<h2>📚 理论框架</h2><div class='cd'><h4 style='color:#58a6ff;border-left:4px solid #58a6ff;padding-left:10px;margin:16px 0 10px'>1. 基于机器学习模型的交易策略的核心理念及优缺点</h4><h4 style='color:#58a6ff;margin:12px 0 8px'>（1）核心理念</h4><p style='text-indent:2em'>传统量化交易主要依赖人工制定交易规则(如均线金叉买入、RSI<30买入等)，这类策略属于规则驱动(Rule-based)策略，其交易逻辑完全依赖投资者经验和预设规则。而基于机器学习的交易策略属于数据驱动(Data-driven)策略，其核心思想是利用历史股票数据，通过机器学习算法自动学习股票价格与各种影响因素之间的关系，从而预测未来股票收益或涨跌方向，并根据预测结果制定交易决策。</p><p style='text-indent:2em'>机器学习交易策略通常包括数据收集、特征工程、模型训练、预测、交易信号生成以及策略回测等多个环节。与传统策略相比，机器学习模型无需人工设定复杂的交易规则，而是能够自动发现隐藏在大量历史数据中的统计规律。</p><h4 style='color:#58a6ff;margin:12px 0 8px'>（2）机器学习交易策略的优点</h4><p style='text-indent:2em'>首先，机器学习能够学习复杂的非线性关系。随机森林(Random Forest)、XGBoost等算法能够学习多个因子之间复杂的交互关系。</p><p style='text-indent:2em'>其次，机器学习能够同时融合大量因子，可以同时使用技术指标、基本面指标、市场情绪指标等几十甚至上百个特征进行综合分析。</p><p style='text-indent:2em'>第三，模型具有自动学习能力，能够根据历史数据自动学习各个因子的最佳组合关系，无需人为设定固定阈值。</p><p style='text-indent:2em'>第四，训练完成后可以快速应用于全市场股票预测，实现自动化选股、自动更新和批量运行。</p><p style='text-indent:2em'>最后，随着市场数据不断更新，可以采用滚动训练(Rolling Training)或定期重新训练模型，使模型不断学习新的市场特征。</p><h4 style='color:#58a6ff;margin:12px 0 8px'>（3）机器学习交易策略的缺点</h4><p style='text-indent:2em'>首先，机器学习模型容易发生过拟合(Overfitting)，可能在训练集上取得很高的预测精度，但在真实交易环境中的表现却明显下降，需要通过交叉验证、正则化以及滚动训练等方法降低过拟合风险。</p><p style='text-indent:2em'>其次，模型对数据质量要求较高。缺失值、异常值、复权错误以及停牌数据等都会影响模型训练效果。</p><p style='text-indent:2em'>第三，模型可解释性相对较差，对于随机森林、XGBoost等集成学习算法，很难直接解释模型为何预测某只股票上涨，只能借助特征重要性分析或SHAP等方法辅助解释。</p><p style='text-indent:2em'>第四，股票市场具有明显的非平稳性，模型在历史数据中学习到的规律可能随着市场风格变化而失效。</p><p style='text-indent:2em'>最后，机器学习模型通常具有较多超参数，如树深度、学习率、叶节点数量等，需要通过网格搜索或贝叶斯优化进行调优。</p><hr style='border:1px solid #30363d;margin:24px 0'><h4 style='color:#58a6ff;border-left:4px solid #58a6ff;padding-left:10px;margin:16px 0 10px'>2. 量化交易机器学习模型中常见自变量因子和应变量的定义</h4><p style='text-align:center;font-size:1.4em;color:#58a6ff;margin:18px 0'><strong>Y = f(X)</strong></p><p style='text-indent:2em'>其中，X表示模型输入的自变量(Feature)，即影响股票未来表现的各种特征因子；Y表示模型输出的应变量(Label)，即模型希望预测的目标。</p><h4 style='color:#58a6ff;margin:12px 0 8px'>（1）自变量（Feature）</h4><p style='text-indent:2em'>自变量是输入到机器学习模型中的特征信息，根据来源不同，可以分为以下几类：</p><ul><li><strong>技术指标因子：</strong>MA、MACD、RSI、KDJ、BOLL、ATR等，反映趋势、动量、超买超卖状态。</li><li><strong>价格因子：</strong>开收高低价、收益率、振幅、跳空缺口等。</li><li><strong>成交量因子：</strong>成交量、成交额、量比、换手率等，衡量市场活跃程度和资金参与情况。</li><li><strong>趋势因子：</strong>MA10>MA20>MA60等均线排列关系、ADX等趋势强度指标。</li><li><strong>波动率因子：</strong>ATR、历史波动率、标准差等，衡量价格波动风险。</li><li><strong>基本面因子：</strong>PE、PB、PS、MV、净利润增长率、营业收入增长率、EPS、ROE等，反映企业盈利能力、成长性及估值水平。</li><li><strong>市场情绪因子：</strong>北向资金流入、融资融券余额、新闻情绪、搜索指数等。</li></ul><p style='text-indent:2em'>在本研究中，模型主要采用了估值因子、规模因子和成长因子作为基础特征，并进一步构造了对数市值(log_MV)、盈利收益率(EP)、账面收益率(BP)、销售收益率(SP)、横截面排名因子以及估值-成长交互因子等36个衍生特征。</p><h4 style='color:#58a6ff;margin:12px 0 8px'>（2）应变量（Label）</h4><p style='text-indent:2em'>对于回归模型，应变量通常定义为未来一段时间的收益率(Next_Return)。</p><p style='text-indent:2em'>对于分类模型，应变量通常定义为股票未来是否上涨：当未来收益率大于0时Label=1，否则Label=0。</p><p style='text-indent:2em'>本研究采用未来一期收益率(<strong>Next_Ret</strong>)作为主要应变量建立回归模型，同时构建二分类标签 <strong>Label_Up = (Next_Ret &gt; 0)</strong> 用于评价模型对股票涨跌方向的预测能力。</p></div>";

function ly(t){return{title:{text:t,font:{color:'#e6edf3',size:15}},paper_bgcolor:'#161b22',plot_bgcolor:'#161b22',font:{color:'#8b949e'},margin:{t:50,b:70,l:70,r:30},legend:{bgcolor:'rgba(33,38,45,0.9)'}};}
function drawC(){var tr=[];MO.forEach(function(m){var r=DR[m];tr.push({type:'scatter',mode:'lines+markers',name:m,y:r.cum_eq,x:['Start'].concat(QS),line:{color:CO[m],width:2.5},marker:{size:5}});});tr.push({type:'scatter',mode:'lines+markers',name:'基准',x:['Start'].concat(QS),y:[1,0.9133,0.9229,0.838],line:{color:'#f85149',width:2,dash:'dash'},marker:{size:5}});Plotly.newPlot('cC',tr,ly('累计净值曲线'),{responsive:true});}
function drawB(){var tr=[];MO.forEach(function(m){var qr=DR[m].quarters;tr.push({type:'bar',name:m,x:QS,y:qr.map(function(q){return q.top30_eq_return;}),marker:{color:CO[m]}});});tr.push({type:'bar',name:'基准',x:QS,y:[-0.0867,0.0105,-0.092],marker:{color:'#f85149'}});Plotly.newPlot('bC',tr,ly('季度收益率'),{responsive:true});}
function drawH(){var z=[],tx=[];MO.forEach(function(m){var qr=DR[m].quarters;z.push(qr.map(function(q){return q.excess_return;}));tx.push(qr.map(function(q){return(q.excess_return*100).toFixed(1)+'%';}));});Plotly.newPlot('hC',[{type:'heatmap',z:z,x:QS,y:MO,text:tx,texttemplate:'%{text}',textfont:{color:'#e6edf3',size:12},colorscale:[[0,'#f85149'],[0.5,'#21262d'],[1,'#3fb950']],colorbar:{title:'超额'}}],ly('超额收益热力图'),{responsive:true});}
function drawR(){var ye=[],yp=[];MO.forEach(function(m){ye.push(DR[m].total_eq);yp.push(DR[m].total_pw);});Plotly.newPlot('rC',[{type:'bar',x:MO,y:ye,name:'等权',marker:{color:MO.map(function(m){return CO[m];})}},{type:'bar',x:MO,y:yp,name:'加权',marker:{color:MO.map(function(m){return CO[m];}),opacity:0.75}}],ly('总收益对比'),{responsive:true});}
function go(n){for(var i=0;i<9;i++){var e=document.getElementById('s'+i);if(e)e.className=i===n?'box on':'box';}var bs=document.querySelectorAll('.bar button');for(var i=0;i<bs.length;i++){bs[i].className=i===n?'bar button on':'bar button';}if(n===4&&!c4){setTimeout(function(){drawC();drawB();c4=1;},200);}if(n===6&&!c6){setTimeout(function(){drawH();drawR();c6=1;},200);}}
